name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X github.com/shellus/ags/internal/version.Version=$VERSION" -o dist/ags-linux-amd64 ./cmd/ags
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X github.com/shellus/ags/internal/version.Version=$VERSION" -o dist/ags-windows-amd64.exe ./cmd/ags
          (cd dist && sha256sum ags-linux-amd64 ags-windows-amd64.exe > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --title "AGS ${{ github.ref_name }}"
