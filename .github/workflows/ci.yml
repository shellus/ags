name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/ags-linux-amd64 ./cmd/ags
      - run: GOOS=windows GOARCH=amd64 go build -o /tmp/ags-windows-amd64.exe ./cmd/ags
      - run: bash -n scripts/install.sh
